name: Reference implementations
on:
  push:
    branches: [main]
    paths: &paths
      - 'implementations/**'
      - 'examples/**'
      - 'schema/**'
      - 'tests/**'
      - '.github/workflows/reference-implementations.yml'
      - '!**/*.md'
  pull_request:
    paths: *paths
jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y cmake libavahi-compat-libdnssd-dev avahi-daemon
      - name: Set up Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e 'implementations/python[test]'
      - name: Fetch C dependencies
        run: .venv/bin/python implementations/c/tools/fetch_deps.py
      - name: Build Rust library and examples
        run: |
          cargo build --locked --manifest-path implementations/rust/Cargo.toml
          cargo build --locked --manifest-path examples/rust/Cargo.toml
      - name: Build C library and examples
        run: |
          cmake -S implementations/c -B implementations/c/build -DCMAKE_BUILD_TYPE=Debug
          cmake --build implementations/c/build --parallel 4
      - name: Build ESP32 native test programs
        run: |
          cmake -S examples/esp32/tests -B examples/esp32/build-native -DCMAKE_BUILD_TYPE=Debug
          cmake --build examples/esp32/build-native --parallel 4
      - name: Test ESP32 native C and Python integration
        run: |
          ctest --test-dir examples/esp32/build-native --output-on-failure
          .venv/bin/python -m pytest examples/esp32/tests
      - name: Check schema conformance fixtures
        run: |
          .venv/bin/python tests/compatibility/fixtures.py
          .venv/bin/python -m pytest tests/compatibility/test_conformance.py
      - name: Test Python
        run: .venv/bin/python -m pytest implementations/python/tests
      - name: Test Rust library and examples
        run: |
          cargo test --locked --manifest-path implementations/rust/Cargo.toml
          cargo test --locked --manifest-path examples/rust/Cargo.toml
      - name: Test C
        run: ctest --test-dir implementations/c/build --output-on-failure
      - name: Test QUIC compatibility
        run: .venv/bin/python tests/compatibility/run.py
      - name: Test adversarial streams
        run: .venv/bin/python tests/compatibility/adversarial.py
      - name: Test reference applications
        run: .venv/bin/python tests/compatibility/reference_apps.py
      - name: Verify Python and Rust packages
        run: |
          .venv/bin/python -m build implementations/python
          cargo package --locked --allow-dirty --manifest-path implementations/rust/Cargo.toml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-results
          path: test-results/
