name: Reference implementations
on:
  push:
  pull_request:
jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y cmake libavahi-compat-libdnssd-dev avahi-daemon
      - name: Set up Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e 'implementations/python[test]'
      - name: Fetch C dependencies
        run: .venv/bin/python implementations/c/tools/fetch_deps.py
      - name: Build Rust library and examples
        run: |
          cargo build --locked --manifest-path implementations/rust/Cargo.toml
          cargo build --locked --manifest-path examples/rust/Cargo.toml
      - name: Build C library and examples
        run: |
          cmake -S implementations/c -B implementations/c/build -DCMAKE_BUILD_TYPE=Debug
          cmake --build implementations/c/build --parallel 4
      - name: Build ESP32 native test programs
        run: |
          cmake -S examples/esp32/tests -B examples/esp32/build-native -DCMAKE_BUILD_TYPE=Debug
          cmake --build examples/esp32/build-native --parallel 4
      - name: Test ESP32 native C and Python integration
        run: |
          ctest --test-dir examples/esp32/build-native --output-on-failure
          .venv/bin/python -m pytest examples/esp32/tests
      - name: Check schema conformance fixtures
        run: |
          .venv/bin/python tests/compatibility/fixtures.py
          .venv/bin/python -m pytest tests/compatibility/test_conformance.py
      - name: Test Python
        run: .venv/bin/python -m pytest implementations/python/tests
      - name: Test Rust library and examples
        run: |
          cargo test --locked --manifest-path implementations/rust/Cargo.toml
          cargo test --locked --manifest-path examples/rust/Cargo.toml
      - name: Test C
        run: ctest --test-dir implementations/c/build --output-on-failure
      - name: Test QUIC compatibility
        run: .venv/bin/python tests/compatibility/run.py
      - name: Test adversarial streams
        run: .venv/bin/python tests/compatibility/adversarial.py
      - name: Test reference applications
        run: .venv/bin/python tests/compatibility/reference_apps.py
      - name: Verify Python and Rust packages
        run: |
          .venv/bin/python -m build implementations/python
          cargo package --locked --allow-dirty --manifest-path implementations/rust/Cargo.toml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-results
          path: test-results/
  windows-c-abi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install NASM for aws-lc
        run: |
          choco install nasm --no-progress -y
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build Rust DLL and Rust example
        run: |
          cargo build --locked --release --target x86_64-pc-windows-msvc --manifest-path implementations/rust/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --target x86_64-pc-windows-msvc --manifest-path examples/rust/Cargo.toml
      - name: Compile and run MSVC C consumer
        run: |
          $lib = "$env:GITHUB_WORKSPACE/implementations/rust/target/x86_64-pc-windows-msvc/release"
          cmake -S examples/c-ffi -B examples/c-ffi/build -A x64 "-DCGP_RUST_LIBRARY=$lib/common_golf_protocol.dll.lib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build examples/c-ffi/build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$lib/common_golf_protocol.dll" examples/c-ffi/build/Release/
          ctest --test-dir examples/c-ffi/build -C Release --output-on-failure
      - name: Test native C to Rust QUIC and fingerprint pinning
        run: |
          $env:CGP_C_EXAMPLE = "$env:GITHUB_WORKSPACE/examples/c-ffi/build/Release/cgp-c-ffi.exe"
          cargo test --locked --target x86_64-pc-windows-msvc --manifest-path implementations/rust/Cargo.toml --test ffi -- --ignored
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test C# P/Invoke loading and discovery lifecycle
        run: |
          $env:PATH = "$env:GITHUB_WORKSPACE/examples/c-ffi/build/Release;$env:PATH"
          dotnet run --project examples/csharp/Smoke.csproj --configuration Release
      - name: Package native SDK
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item implementations/rust/target/x86_64-pc-windows-msvc/release/common_golf_protocol.dll dist/
          Copy-Item implementations/rust/target/x86_64-pc-windows-msvc/release/common_golf_protocol.dll.lib dist/
          Copy-Item implementations/rust/include/cgp_rust.h dist/
          Copy-Item examples/c-ffi/README.md dist/
          Copy-Item examples/c-ffi/build/Release/cgp-c-ffi.exe dist/
      - uses: actions/upload-artifact@v4
        with:
          name: cgp-windows-x64-sdk
          path: dist/
