[package]
name = "cgp-example"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
common-golf-protocol = { path = "../../implementations/rust" }
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
noq = { version = "=1.3.0", default-features = false, features = ["runtime-tokio", "rustls", "aws-lc-rs"] }

[[bin]]
name = "cgp-demo"
path = "src/main.rs"
