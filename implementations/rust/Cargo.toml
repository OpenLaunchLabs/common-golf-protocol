[package]
name = "common-golf-protocol"
version = "0.2.0"
edition = "2021"
rust-version = "1.90"
description = "Common Golf Protocol reference implementation with QUIC and DNS-SD"
license = "Apache-2.0"
readme = "README.md"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "arbitrary_precision"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
noq = { version = "=1.3.0", default-features = false, features = ["runtime-tokio", "rustls", "aws-lc-rs"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
x509-parser = "0.18"
mdns-sd = "0.13"

[[bin]]
name = "cgp-peer"
path = "src/bin/cgp-peer.rs"
